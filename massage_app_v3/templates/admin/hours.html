{% extends 'admin/base.html' %}
{% block content %}
<div class="page-header">
  <h1>Delovni čas</h1>
  <p>Spremembe se takoj odrazijo na spletni strani in obrazcu za rezervacije</p>
</div>
<div class="form-card">
  <h3>Uredi delovni čas</h3>
  <form method="POST">
    {% for h in hours %}
    <div class="hours-row">
      <strong style="color:#333;">{{ h.day_sl }}</strong>
      <label style="display:flex;align-items:center;gap:0.4rem;font-size:0.88rem;cursor:pointer;">
        <input type="checkbox" name="open_{{ h.day_index }}" {{ 'checked' if h.is_open }}
          onchange="toggleDay({{ h.day_index }}, this.checked)"> Odprto
      </label>
      <div class="form-group" style="margin:0;">
        <label style="font-size:0.72rem;">Od</label>
        <input type="time" name="open_time_{{ h.day_index }}" value="{{ h.open_time or '' }}"
          id="open_{{ h.day_index }}" {{ 'disabled' if not h.is_open }}>
      </div>
      <div class="form-group" style="margin:0;">
        <label style="font-size:0.72rem;">Do</label>
        <input type="time" name="close_time_{{ h.day_index }}" value="{{ h.close_time or '' }}"
          id="close_{{ h.day_index }}" {{ 'disabled' if not h.is_open }}>
      </div>
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-gold" style="margin-top:1.5rem;">💾 Shrani delovni čas</button>
  </form>
</div>
<script>
function toggleDay(i, open) {
  document.getElementById('open_' + i).disabled = !open;
  document.getElementById('close_' + i).disabled = !open;
}
</script>
{% endblock %}
